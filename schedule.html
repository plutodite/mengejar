<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Schedule</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <h2>Class X ICT Weeklly Schedule</h2>
    <div class="rounded-xl overflow-hidden border border-gray max-w-sm">
    <table border="1" class="table-auto bg-green-400 border-collapse:collapse">
        <!-- TABLE HEADER -->
         <thead class="border border-black">
            <tr>
                <th class="border border-black px-4 py-2">Day</th>
                <th class="border border-black px-4 py-2">Time</th>
                <th class="border border-black px-4 py-2">Subject</th>
            </tr>
         </thead>
         <!-- TABLE BODY -->
          <tbody>
            <tr>
                <td>Monday</td>
                <td>9.00</td>
                <td>Biology</td>
            </tr>
            <tr>
                <td>Tuesday</td>
                <td>9.00</td>
                <td>Civic</td>
            </tr>
          </tbody>
    </table>
    </div>
</body>
</html>
